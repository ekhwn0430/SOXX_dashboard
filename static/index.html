<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SOXX Dashboard</title>
    <style>
        :root {
            --bg: #0d201d;
            --bg-card: #123330;
            --border: #1f4541;
            --text: #e8f2f0;
            --text-dim: #7fa39c;
            --accent: #4fe0c8;
            --accent2: #e3b04b;
            --up: #2ecc71;
            --down: #ff5c5c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            margin: 0;
            padding: 40px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .fx-rate {
            font-size: 13px;
            color: var(--text-dim);
        }

        .fx-rate .value {
            color: var(--text-dim);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 32px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            background: transparent;
            border: none;
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
        }

        .tab-btn:hover {
            background: var(--bg-card);
        }

        .tab-btn.active {
            color: var(--bg);
            background: var(--up);
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 32px;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        .summary-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .summary-name {
            font-size: 18px;
            font-weight: 700;
        }

        .summary-ticker {
            font-size: 12px;
            color: var(--text-dim);
        }

        .summary-price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }

        .summary-price-text {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .summary-sparkline svg {
            display: block;
        }

        .summary-sparkline polyline {
            fill: none;
            stroke-width: 1.5;
        }

        .summary-price {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .summary-change {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .summary-change.up {
            color: var(--up);
        }

        .summary-change.down {
            color: var(--down);
        }

        .summary-sub {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .summary-sub-krw {
            margin-top: 2px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .summary-divider {
            border-top: 1px solid var(--border);
            margin: 18px 0;
        }

        .summary-stats {
            display: flex;
            justify-content: space-between;
        }

        .summary-stats .label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .summary-stats .value {
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        table {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: var(--bg-card);
        }

        .ticker {
            font-weight: 600;
        }

        .name {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
        }

        .price {
            font-variant-numeric: tabular-nums;
        }

        .change {
            font-variant-numeric: tabular-nums;
        }

        .change.up {
            color: var(--up);
        }

        .change.down {
            color: var(--down);
        }

        .weight {
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        .sparkline-cell svg {
            display: block;
        }

        .sparkline-cell polyline {
            fill: none;
            stroke-width: 1.5;
        }

        @keyframes flash-up {
            0% { color: var(--up); }
            100% { color: inherit; }
        }

        @keyframes flash-down {
            0% { color: var(--down); }
            100% { color: inherit; }
        }

        .flash-up {
            animation: flash-up 0.6s ease-out;
        }

        .flash-down {
            animation: flash-down 0.6s ease-out;
        }

        .mcap-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .mcap-columns {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 80px;
        }

        .mcap-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mcap-value {
            font-size: 30px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mcap-change {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .mcap-change.up {
            color: var(--up);
        }

        .mcap-change.down {
            color: var(--down);
        }

        .mcap-bar-wrap {
            height: 220px;
            display: flex;
            align-items: flex-end;
            margin-top: 20px;
        }

        .mcap-bar {
            width: 90px;
            border-radius: 8px 8px 0 0;
            transition: height 0.6s ease-out;
        }

        .mcap-bar-a {
            background: linear-gradient(180deg, var(--accent), transparent);
        }

        .mcap-bar-b {
            background: linear-gradient(180deg, var(--accent2), transparent);
        }

        .mcap-label {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
        }

        .mcap-gap {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 16px;
            color: var(--text-dim);
        }

        .mcap-gap .highlight {
            color: var(--text);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SOXX Dashboard</h1>
        <div class="fx-rate">USD/KRW <span class="value" id="fx-value">-</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-view="dashboard">대시보드</button>
        <button class="tab-btn" data-view="index">지수</button>
        <button class="tab-btn" data-view="marketcap">시총비교</button>
    </div>

    <div id="view-dashboard" class="view active">
        <div class="summary-grid" id="summary-grid"></div>

        <table>
            <thead>
                <tr>
                    <th>종목</th>
                    <th>현재가</th>
                    <th>등락률</th>
                    <th>비중</th>
                    <th>스파크라인</th>
                </tr>
            </thead>
            <tbody id="quotes-body">
            </tbody>
        </table>
    </div>

    <div id="view-index" class="view">
        <div class="summary-grid" id="index-grid"></div>
    </div>

    <div id="view-marketcap" class="view">
        <div class="mcap-card">
            <div class="mcap-columns">
                <div class="mcap-col">
                    <div class="mcap-value"><span class="value" id="mcap-soxx-value">-</span></div>
                    <div class="mcap-change" id="mcap-soxx-change">-</div>
                    <div class="mcap-bar-wrap"><div class="mcap-bar mcap-bar-a" id="mcap-soxx-bar" style="height: 0"></div></div>
                    <div class="mcap-label">SOXX</div>
                </div>
                <div class="mcap-col">
                    <div class="mcap-value"><span class="value" id="mcap-soxl-value">-</span></div>
                    <div class="mcap-change" id="mcap-soxl-change">-</div>
                    <div class="mcap-bar-wrap"><div class="mcap-bar mcap-bar-b" id="mcap-soxl-bar" style="height: 0"></div></div>
                    <div class="mcap-label">SOXL</div>
                </div>
            </div>
            <div class="mcap-gap" id="mcap-gap">-</div>
        </div>
    </div>

    <script>
        const REFRESH_SUMMARY_MS = 5000;
        const REFRESH_QUOTES_MS = 5000;
        const ROLL_DURATION_MS = 600;

        function sparklinePoints(values) {
            const lo = Math.min(...values);
            const hi = Math.max(...values);
            const range = hi - lo || 1;
            return values
                .map((v, i) => {
                    const x = (i / (values.length - 1)) * 100;
                    const y = 24 - ((v - lo) / range) * 24;
                    return `${x.toFixed(1)},${y.toFixed(1)}`;
                })
                .join(" ");
        }

        function upDownColor(isUp) {
            return getComputedStyle(document.documentElement)
                .getPropertyValue(isUp ? "--up" : "--down");
        }

        function formatPrice(v) {
            return `$${v.toFixed(2)}`;
        }

        function formatChange(v) {
            const sign = v >= 0 ? "+" : "";
            return `${sign}${v.toFixed(2)}%`;
        }

        function formatMarketCap(v) {
            if (v >= 1e9) return `$${(v / 1e9).toFixed(2)}B`;
            return `$${(v / 1e6).toFixed(1)}M`;
        }

        function formatWon(v) {
            return `≈ ₩${Math.round(v).toLocaleString("ko-KR")}`;
        }

        // 최근 조회된 USD/KRW 환율. loadFxRate()가 갱신하고, 카드들이 원화 환산에 사용.
        let currentFxRate = null;

        // 값이 바뀌는 순간 초록(상승)/빨강(하락)으로 잠깐 반짝였다가 원래 색으로 복귀.
        function flash(el, isUp) {
            el.classList.remove("flash-up", "flash-down");
            void el.offsetWidth;  // 리플로우 강제 — 애니메이션 클래스 재적용해도 처음부터 다시 재생되게
            el.classList.add(isUp ? "flash-up" : "flash-down");
        }

        // el의 표시값을 from -> to 로 ROLL_DURATION_MS 동안 ease-out 보간하며 굴림.
        // 값이 실제로 바뀔 때만 굴리고 플래시하며, 안 바뀌면 그냥 표시만 맞춤.
        function animateNumberRoll(el, from, to, formatFn) {
            if (from === to) {
                el.textContent = formatFn(to);
                return;
            }
            flash(el, to > from);

            const startTime = performance.now();
            function tick(now) {
                const progress = Math.min((now - startTime) / ROLL_DURATION_MS, 1);
                const eased = 1 - (1 - progress) * (1 - progress);  // ease-out
                el.textContent = formatFn(from + (to - from) * eased);
                if (progress < 1) {
                    requestAnimationFrame(tick);
                }
            }
            requestAnimationFrame(tick);
        }

        // 티커 -> { tr, priceEl, changeEl, changeTd, lastPrice, lastChangeRate }
        const rowsByTicker = new Map();

        function createRow(quote) {
            const isUp = quote.change_rate >= 0;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <span class="ticker">${quote.ticker}</span>
                    <span class="name">${quote.name}</span>
                </td>
                <td class="price"><span class="value">${formatPrice(quote.price)}</span></td>
                <td class="change ${isUp ? "up" : "down"}"><span class="value">${formatChange(quote.change_rate)}</span></td>
                <td class="weight">${quote.weight.toFixed(2)}%</td>
                <td class="sparkline-cell">
                    <svg width="100" height="24" viewBox="0 0 100 24">
                        <polyline points="${sparklinePoints(quote.sparkline)}" stroke="${upDownColor(isUp)}" />
                    </svg>
                </td>
            `;

            rowsByTicker.set(quote.ticker, {
                tr,
                priceEl: tr.querySelector(".price .value"),
                changeTd: tr.querySelector(".change"),
                changeEl: tr.querySelector(".change .value"),
                sparklineEl: tr.querySelector(".sparkline-cell polyline"),
                lastPrice: quote.price,
                lastChangeRate: quote.change_rate,
            });
            return tr;
        }

        function updateRow(entry, quote) {
            const isUp = quote.change_rate >= 0;

            entry.changeTd.classList.remove("up", "down");
            entry.changeTd.classList.add(isUp ? "up" : "down");

            animateNumberRoll(entry.priceEl, entry.lastPrice, quote.price, formatPrice);
            animateNumberRoll(entry.changeEl, entry.lastChangeRate, quote.change_rate, formatChange);

            entry.sparklineEl.setAttribute("points", sparklinePoints(quote.sparkline));
            entry.sparklineEl.setAttribute("stroke", upDownColor(isUp));

            entry.lastPrice = quote.price;
            entry.lastChangeRate = quote.change_rate;
        }

        // 티커 -> { card, priceEl, changeEl, subEl, highEl, lowEl, lastPrice }
        // 요약 카드(SOXX/SOXL)용, 지수 카드(SPY/QQQ)용 — 둘 다 같은 카드 구조를 쓰므로 Map만 분리.
        const cardsByTicker = new Map();
        const indexCardsByTicker = new Map();

        function createSummaryCard(item, cardsMap) {
            const isUp = item.change_rate >= 0;
            const arrow = isUp ? "▲" : "▼";
            const high = Math.max(...item.sparkline);
            const low = Math.min(...item.sparkline);

            const div = document.createElement("div");
            div.className = "summary-card";
            div.innerHTML = `
                <div class="summary-header">
                    <div>
                        <div class="summary-name">${item.name}</div>
                        <div class="summary-ticker">${item.ticker}</div>
                    </div>
                </div>
                <div class="summary-price-row">
                    <div class="summary-price-text">
                        <span class="summary-price"><span class="value">${formatPrice(item.price)}</span></span>
                        <span class="summary-change ${isUp ? "up" : "down"}">${arrow} ${formatChange(item.change_rate)}</span>
                    </div>
                    <div class="summary-sparkline">
                        <svg width="140" height="40" viewBox="0 0 100 24">
                            <polyline points="${sparklinePoints(item.sparkline)}" stroke="${upDownColor(isUp)}" />
                        </svg>
                    </div>
                </div>
                <div class="summary-sub">전일 종가 ${formatPrice(item.prev_close)}</div>
                <div class="summary-sub-krw"><span class="value">${currentFxRate === null ? "-" : formatWon(item.price * currentFxRate)}</span></div>
                <div class="summary-divider"></div>
                <div class="summary-stats">
                    <div>
                        <span class="label">당일 고가</span>
                        <span class="value">${formatPrice(high)}</span>
                    </div>
                    <div>
                        <span class="label">당일 저가</span>
                        <span class="value">${formatPrice(low)}</span>
                    </div>
                </div>
            `;

            cardsMap.set(item.ticker, {
                card: div,
                priceEl: div.querySelector(".summary-price .value"),
                changeEl: div.querySelector(".summary-change"),
                subEl: div.querySelector(".summary-sub"),
                krwEl: div.querySelector(".summary-sub-krw .value"),
                sparklineEl: div.querySelector(".summary-sparkline polyline"),
                highEl: div.querySelectorAll(".summary-stats .value")[0],
                lowEl: div.querySelectorAll(".summary-stats .value")[1],
                lastPrice: item.price,
                lastKrw: currentFxRate === null ? null : item.price * currentFxRate,
            });
            return div;
        }

        // 환율 알면 가격을 원화로 환산해서 롤링 애니메이션, 모르면 그냥 둠(다음 갱신 때 채워짐).
        function updateKrw(entry, price) {
            if (currentFxRate === null) return;
            const newKrw = price * currentFxRate;
            if (entry.lastKrw === null) {
                entry.krwEl.textContent = formatWon(newKrw);
            } else {
                animateNumberRoll(entry.krwEl, entry.lastKrw, newKrw, formatWon);
            }
            entry.lastKrw = newKrw;
        }

        function updateSummaryCard(entry, item) {
            const isUp = item.change_rate >= 0;
            const high = Math.max(...item.sparkline);
            const low = Math.min(...item.sparkline);

            animateNumberRoll(entry.priceEl, entry.lastPrice, item.price, formatPrice);

            entry.changeEl.className = `summary-change ${isUp ? "up" : "down"}`;
            entry.changeEl.textContent = `${isUp ? "▲" : "▼"} ${formatChange(item.change_rate)}`;
            entry.subEl.textContent = `전일 종가 ${formatPrice(item.prev_close)}`;
            entry.sparklineEl.setAttribute("points", sparklinePoints(item.sparkline));
            entry.sparklineEl.setAttribute("stroke", upDownColor(isUp));
            entry.highEl.textContent = formatPrice(high);
            entry.lowEl.textContent = formatPrice(low);
            updateKrw(entry, item.price);

            entry.lastPrice = item.price;
        }

        // 요약/지수 카드 공통 로더. cardsMap에 없는 티커는 새로 만들고, 있으면 값만 갱신.
        async function loadCardGrid(url, gridId, cardsMap) {
            const response = await fetch(url);
            const items = await response.json();
            const grid = document.getElementById(gridId);

            items.forEach((item) => {
                const entry = cardsMap.get(item.ticker);
                if (entry) {
                    updateSummaryCard(entry, item);
                } else {
                    grid.appendChild(createSummaryCard(item, cardsMap));
                }
            });
        }

        let summaryLoading = false;
        let indexLoading = false;
        let quotesLoading = false;

        async function loadSummary() {
            if (summaryLoading) return;  // 이전 요청이 아직 처리중이면 이번 폴링은 건너뜀 (요청 겹침 방지)
            summaryLoading = true;
            try {
                await loadCardGrid("/api/summary", "summary-grid", cardsByTicker);
            } finally {
                summaryLoading = false;
            }
        }

        async function loadIndex() {
            if (indexLoading) return;
            indexLoading = true;
            try {
                await loadCardGrid("/api/index", "index-grid", indexCardsByTicker);
            } finally {
                indexLoading = false;
            }
        }

        async function loadFxRate() {
            const response = await fetch("/api/exchange-rate");
            const rate = await response.json();
            currentFxRate = rate;
            document.getElementById("fx-value").textContent = `₩${rate.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}`;
        }

        const MCAP_BAR_MAX_PX = 220;
        let lastMcap = { SOXX: null, SOXL: null };

        async function loadMarketCap() {
            const response = await fetch("/api/market-cap");
            const items = await response.json();
            if (items.length < 2) return;  // 캐시가 아직 안 채워졌으면 건너뜀

            const byTicker = Object.fromEntries(items.map((i) => [i.ticker, i]));
            const maxCap = Math.max(...items.map((i) => i.market_cap));

            ["SOXX", "SOXL"].forEach((ticker) => {
                const item = byTicker[ticker];
                if (!item) return;
                const prefix = ticker.toLowerCase();
                const valueEl = document.getElementById(`mcap-${prefix}-value`);
                const changeEl = document.getElementById(`mcap-${prefix}-change`);
                const barEl = document.getElementById(`mcap-${prefix}-bar`);

                const from = lastMcap[ticker] === null ? item.market_cap : lastMcap[ticker];
                animateNumberRoll(valueEl, from, item.market_cap, formatMarketCap);

                const isUp = item.change_rate >= 0;
                changeEl.className = `mcap-change ${isUp ? "up" : "down"}`;
                changeEl.textContent = formatChange(item.change_rate);

                barEl.style.height = `${(item.market_cap / maxCap) * MCAP_BAR_MAX_PX}px`;

                lastMcap[ticker] = item.market_cap;
            });

            const [a, b] = items;
            const bigger = a.market_cap >= b.market_cap ? a : b;
            const smaller = a.market_cap >= b.market_cap ? b : a;
            const gapPct = (bigger.market_cap / smaller.market_cap - 1) * 100;
            document.getElementById("mcap-gap").innerHTML =
                `<span class="highlight">${bigger.ticker}</span>가 ${smaller.ticker}보다 ` +
                `${formatMarketCap(bigger.market_cap - smaller.market_cap)} (${gapPct.toFixed(1)}%) 더 큼`;
        }

        async function loadQuotes() {
            if (quotesLoading) return;  // 20종목 조회는 한 사이클에 10초 넘게 걸릴 수 있어서 겹침 방지 필수
            quotesLoading = true;

            try {
                const response = await fetch("/api/quotes");
                const quotes = await response.json();
                const tbody = document.getElementById("quotes-body");

                quotes.forEach((quote) => {
                    const entry = rowsByTicker.get(quote.ticker);
                    if (entry) {
                        updateRow(entry, quote);
                    } else {
                        tbody.appendChild(createRow(quote));
                    }
                });
            } finally {
                quotesLoading = false;
            }
        }

        document.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
                document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));

                btn.classList.add("active");
                document.getElementById(`view-${btn.dataset.view}`).classList.add("active");
            });
        });

        loadSummary();
        loadIndex();
        loadQuotes();
        loadFxRate();
        loadMarketCap();
        setInterval(loadSummary, REFRESH_SUMMARY_MS);
        setInterval(loadIndex, REFRESH_SUMMARY_MS);
        setInterval(loadQuotes, REFRESH_QUOTES_MS);
